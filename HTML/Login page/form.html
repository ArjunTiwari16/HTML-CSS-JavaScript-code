<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <header>
        <center>
        <h1>Registration Form</h1>
        </center>
    </header>
    <hr>
    <main>
        <form action="/action.php">
            <p>NAME : <input type="text" placeholder="Enter Name" name="username"></p>
            <p>PASSWORD : <input type="password" placeholder="Enter correct password" name="password"></p>
            <!-- <hr> -->
            <h3>Select your Class :- </h3>
            <label for="101">
                <input type="radio" value="class X" name="class" id="101">Class x
            </label>
            <label for="102">
                <input type="radio" value="class XII" name="class" id="102">Class XII
            </label>
            <h3>Select your fav subject :-</h3>

            <label for="1">
                <input type="checkbox" value="math" name="subject" id="1">Math
            </label>
            <br>
             <label for="2">
                <input type="checkbox" value="physics" name="subject" id="2">physics
            </label>
            <br>
             <label for="3">
                <input type="checkbox" value="chemistry" name="subject" id="3" >chemistry
            </label>
            <br>
             <label for="4">
                <input type="checkbox" value="biology" name="subject" id="4">biology
            </label>
            <br><br>
            Select your city :
            <select name="City">
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Surat">Surat</option>
                <option value="Goa">Goa</option>
            </select>
            <br><br>
            <textarea name="feedback" id="108" placeholder="please give your valuable feedback here" rows="5">Feedback</textarea>
            <br><br>
            <input type="submit" value="submit"> 
            
        </form>
        <br>
        <!-- <iframe width="" height="" src="" title="" allow=""></iframe> -->

    </main>
</body>
</html>
